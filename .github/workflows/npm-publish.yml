name: Publish to npm

on:
  push:
    branches: [main]

permissions:
  contents: write   # 打 tag 需要
  id-token: write   # --provenance 签名需要（OIDC）

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm test

      - name: 读版本号
        id: pkg
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> $GITHUB_OUTPUT
          echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
          echo "tag=v$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: 已存在则跳过（幂等）
        id: check
        run: |
          if git rev-parse "${{ steps.pkg.outputs.tag }}" >/dev/null 2>&1; then
            echo "tag_exists=true" >> $GITHUB_OUTPUT
          else
            echo "tag_exists=false" >> $GITHUB_OUTPUT
          fi
          if npm view ${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }} version >/dev/null 2>&1; then
            echo "published=true" >> $GITHUB_OUTPUT
          else
            echo "published=false" >> $GITHUB_OUTPUT
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 打 tag
        if: steps.check.outputs.tag_exists == 'false'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.pkg.outputs.tag }}" -m "Release ${{ steps.pkg.outputs.tag }}"
          git push origin "${{ steps.pkg.outputs.tag }}"

      - name: 升级 npm（staged 发布命令需要新版权 npm；node 20 自带的 npm 10 没有 npm stage）
        run: npm install -g npm@latest

      - name: 暂存发布
        # NPM_TOKEN 是新式粒度令牌：注册表只允许它做 staged 发布（直接 publish 会 403 E_STAGE_REQUIRED）。
        # 本步骤把版本上传到暂存区；去 npmjs.com 批准后才会真正上线。
        if: steps.check.outputs.published == 'false'
        run: npm stage publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 提示批准
        if: steps.check.outputs.published == 'false'
        run: |
          echo "版本已提交到 npm 暂存区（staged）。"
          echo "批准方式：npmjs.com → 包页 → Staged 标签页点 Approve；"
          echo "或在已登录的终端执行：npm stage approve ${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }}"