name: Publish to npm

# 发布通道：Trusted Publishing（GitHub OIDC）
#   npm 已限制「绕过 2FA 的 token」直接发布（粒度 token 只能 staged + 人工批准）。
#   官方替代方案 = 在 npmjs.com 给包配 Trusted Publisher（一次性，2FA 网页操作）：
#     Package → Settings → Trusted Publisher → GitHub Actions
#     Org: On-DevPlan / Repo: nx-ft / Workflow: npm-publish.yml
#   配好后本流水线无需任何 NPM_TOKEN 秘密：npm CLI 用 OIDC 换取发布权，直接发版。
#
#   CLI 也能配（必须在本机终端里跑——npm 的 Web 换 OTP 要求 TTY，CI/管道里会直接 EOTP 退出）：
#     npx -y npm@12.2.0 trust list   nx-ft
#     npx -y npm@12.2.0 trust github nx-ft --file npm-publish.yml \
#       --repo On-DevPlan/nx-ft --allow-publish
#   配完不必等下次发版：手动触发本工作流（workflow_dispatch），「OIDC 预检」那步会给出结论。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # 打 tag 需要
  id-token: write   # Trusted Publishing / provenance 签名需要（OIDC）

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          # Node 24：npm@latest（12.x）不支持 Node 20（EBADENGINE）；本地开发同为 24
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm test

      - name: 读版本号
        id: pkg
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> $GITHUB_OUTPUT
          echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
          echo "tag=v$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: 已存在则跳过（幂等）
        id: check
        run: |
          if git rev-parse "${{ steps.pkg.outputs.tag }}" >/dev/null 2>&1; then
            echo "tag_exists=true" >> $GITHUB_OUTPUT
          else
            echo "tag_exists=false" >> $GITHUB_OUTPUT
          fi
          if npm view ${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }} version >/dev/null 2>&1; then
            echo "published=true" >> $GITHUB_OUTPUT
          else
            echo "published=false" >> $GITHUB_OUTPUT
          fi

      - name: 打 tag
        if: steps.check.outputs.tag_exists == 'false'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.pkg.outputs.tag }}" -m "Release ${{ steps.pkg.outputs.tag }}"
          git push origin "${{ steps.pkg.outputs.tag }}"

      - name: 升级 npm（Trusted Publishing 需 npm ≥ 11.6）
        run: npm install -g npm@latest

      - name: OIDC 预检（Trusted Publishing；不打印令牌本体）
        # 这里不手搓换票请求：第一版就是手搓的，结果和 npm 自己发出的请求给出不同结论
        # （手搓得 401 unauthorized，npm 自己得 404 package not found），照它排查会被带偏。
        # 改成直接让 npm 走一遍 publish 的取票路径——--dry-run 不落盘、不发布，但 oidc() 照常执行，
        # verbose 会留下 registry 的真实答复。结论只有两种：拿到票 / 没拿到票。
        # 手动触发（workflow_dispatch）或本次确实要发布时，失败即硬失败；仅跳过发布时降级为 warning。
        run: |
          set -u
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::OIDC 环境缺失（检查 permissions: id-token: write）"
            exit 1
          fi

          OUT=$(npm publish --dry-run --provenance --access public --loglevel verbose 2>&1 || true)
          echo "$OUT" | grep -E 'npm (notice|verbose) (oidc|publish)|npm error' | sed 's/^/  /' | head -40

          if echo "$OUT" | grep -q 'Successfully retrieved and set token'; then
            echo "npm OIDC 换票: 成功 —— trusted publisher 已生效"
            exit 0
          fi

          REASON=$(echo "$OUT" | grep -oE 'Failed token exchange request with body message: .*' | head -1)
          if [ -z "$REASON" ]; then
            REASON=$(echo "$OUT" | grep -oE 'oidc [^ ]*(Failed|Skipped).*' | head -1)
          fi
          if [ -z "$REASON" ]; then
            REASON=$(echo "$OUT" | grep -m1 -E '^npm error' || echo "取票前就失败了，未见 oidc 相关日志")
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ steps.check.outputs.published }}" = "false" ]; then
            echo "::error::npm OIDC 换票失败：${REASON}"
            echo "::error::真发布必然同样失败。先给 ${{ steps.pkg.outputs.name }} 配 Trusted Publisher（见本文件头部注释），再重跑本工作流。"
            exit 1
          fi
          echo "::warning::npm OIDC 换票失败：${REASON} —— 本次版本已发布，不阻断；但下次发版会失败，需先配好 Trusted Publisher"

      - name: 发布（OIDC，无 token）
        if: steps.check.outputs.published == 'false'
        # --loglevel verbose 是刻意打开的：npm 的 OIDC 换票失败是「静默」的——
        # lib/utils/oidc.js 把换票异常全部 catch 掉、只在 verbose 级别记一行，
        # 于是失败在面上只剩 ENEEDAUTH（看起来像「没登录」）。
        # 打开 verbose 才能看到 registry 的真实答复：trusted publisher 未配置 / claims 不匹配 / 只允许 stage publish。
        run: npm publish --provenance --access public --loglevel verbose
